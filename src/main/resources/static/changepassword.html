<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta http-equiv="X-UA-Compatible" content="ie=edge">
		<title>E-Cinema</title>
		<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
        crossorigin="anonymous">
		<script defer src="https://use.fontawesome.com/releases/v5.0.2/js/all.js"></script>
		<link rel="stylesheet" type= "text/css" href="Registration.css">
	</head>
	
	<body>
		<nav class="navbar navbar-expand-sm navbar-dark bg-dark">
			<a href="Cinema.html" class="navbar-brand">E-CinemaX</a>
			<button class="navbar-toggler" data-toggle="collapse" data-target="#navbarMenu">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="navbarMenu">
				<form class="form-inline ml-lg-5">
					<input class="form-control mr-2" type="search" placeholder="Search" aria-label="Search">
					<button class="btn btn-outline-light my-2" type="submit"><i class="fas fa-search"></i></button>
				</form>
				<ul class="navbar-nav ml-auto">
					<li class="nav-item">
						<a href="Useraccount.html"class="nav-link"><i class="fas fa-user" style="margin-right: 10px"></i>ACCOUNT</a>
					</li>
					<li class="nav-item">
						<a href="#" class="nav-link" id="logoutLink">LOGOUT</a>
					</li>
				</ul>
			</div>         
		</nav>
	<div class="container-fluid my-container">
			<div class="title"><br>CHANGE PASSWORD</div>
			<br><hr><br>
	</div>
<section class="vh-100">
  <div class="container py-5 h-100">
    <div class="row d-flex align-items-center justify-content-center h-100">
      <div class="col-md-8 col-lg-7 col-xl-6">
        <img src="https://mdbcdn.b-cdn.net/img/Photos/new-templates/bootstrap-login-form/draw2.svg"
          class="img-fluid" alt="Phone image">
      </div>
      <div class="col-md-7 col-lg-5 col-xl-5 offset-xl-1">
        <form id="changePasswordForm">
          <!-- Email input -->
          <div class="form-group required mb-4">
			  <label class="form-check-label" for="currentPassword"><b>Current Password</b></label>
            <input type="password" id="currentPassword" required class="form-control required form-control-lg" />

          </div>

          <!-- Password input -->
          <div class="form-group required mb-4">
			  <label class="form-check-label" for="newPassword"><b>New Password</b></label>
            <input type="password" id="newPassword" required class="form-control required form-control-lg" />

          </div>

          <div id="passwordError" class="alert alert-danger" style="display: none;"></div>
          <button type="submit" class="btn btn-primary btn-lg btn-block">Update Password</button>
        </form>
      </div>
    </div>
  </div>
</section>
	<script src="js/auth.js"></script>
	<script>
		document.getElementById('logoutLink').addEventListener('click', (event) => {
			event.preventDefault();
			logout();
		});

		getCurrentUser().then(user => {
			if (!user) {
				window.location.href = `Customerlogin.html?returnUrl=${encodeURIComponent(window.location.href)}`;
			}
		});

		document.getElementById('changePasswordForm').addEventListener('submit', async (event) => {
			event.preventDefault();

			const errorBox = document.getElementById('passwordError');
			errorBox.style.display = 'none';

			const response = await fetch('/api/users/me/password', {
				method: 'PUT',
				headers: { 'Content-Type': 'application/json' },
				body: JSON.stringify({
					currentPassword: document.getElementById('currentPassword').value,
					newPassword: document.getElementById('newPassword').value
				})
			});

			if (!response.ok) {
				errorBox.textContent = 'Could not update your password - check your current password and try again.';
				errorBox.style.display = 'block';
				return;
			}

			window.location.href = 'Useraccount.html';
		});
	</script>
	</body>
</html>
