		<script>
			// Splits an array into groups of 5, matching the original layout:
			// one row of 5 posters, then one row of 5 titles/buttons underneath.
			function chunkIntoFives(movies) {
				const groups = [];
				for (let i = 0; i < movies.length; i += 5) {
					groups.push(movies.slice(i, i + 5));
				}
				return groups;
			}

			function posterCellHtml(movie) {
				return `
					<div class="col-md-2 my-col">
						<a href="movieDetails.html?id=${movie.id}">
							<img class="zoom" width="220px" height="320px" src="${movie.posterUrl}" alt="${movie.title}">
						</a>
					</div>`;
			}

			function titleCellHtml(movie, bookButtonLabel) {
				const trailerButtonHtml = movie.youtubeTrailerId
					? `<button class="trailerbutton posterbutton"><a href="https://youtu.be/${movie.youtubeTrailerId}" target="_blank" style="text-decoration: none; color: white;">TRAILER</a></button>`
					: '';
				return `
					<div class="col-md-2 my-col">
						<div class="poster-title">${movie.title.toUpperCase()}</div>
						<div class="buttonDiv">
							${trailerButtonHtml}
							<button class="booknowbutton posterbutton"><a href="movieDetails.html?id=${movie.id}" style="text-decoration: none; color: white;">${bookButtonLabel}</a></button>
						</div>
					</div>`;
			}

			function renderMovieGrid(movies, container, bookButtonLabel) {
				container.innerHTML = chunkIntoFives(movies).map(group => `
					<div class="row my-row justify-content-between">
						${group.map(posterCellHtml).join('')}
					</div>
					<div class="row justify-content-between">
						${group.map(m => titleCellHtml(m, bookButtonLabel)).join('')}
					</div>
					<br>`).join('');
			}

			async function loadMovies() {
				const nowShowingResponse = await fetch('/api/movies?status=NOW_SHOWING');
				const comingSoonResponse = await fetch('/api/movies?status=COMING_SOON');

				renderMovieGrid(await nowShowingResponse.json(), document.getElementById('nowShowingGrid'), 'BOOK NOW');
				renderMovieGrid(await comingSoonResponse.json(), document.getElementById('comingSoonGrid'), 'MORE INFO');
			}

			loadMovies();
		</script>
