<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta http-equiv="X-UA-Compatible" content="ie=edge">
		<title>E-CinemaX</title>
		<link rel="icon" type="image/svg+xml" href="/favicon.svg">
		<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
        crossorigin="anonymous">
		<script defer src="https://use.fontawesome.com/releases/v5.0.2/js/all.js"></script>
		<link rel="stylesheet" type= "text/css" href="Registration.css">
	</head>
	
	<body>
		<nav class="navbar navbar-expand-sm navbar-dark bg-dark">
			<a href="Cinema.html" class="navbar-brand">E-CinemaX</a>
			<button class="navbar-toggler" data-toggle="collapse" data-target="#navbarMenu">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="navbarMenu">
				<form class="form-inline ml-lg-5">
					<input class="form-control mr-2" type="search" placeholder="Search" aria-label="Search">
					<button class="btn btn-outline-light my-2" type="submit"><i class="fas fa-search"></i></button>
				</form>
				<ul class="navbar-nav ml-auto">
					<li class="nav-item">
						<a href="Useraccount.html"class="nav-link"><i class="fas fa-user" style="margin-right: 10px"></i>ACCOUNT</a>
					</li>
					<li class="nav-item">
						<a href="#" class="nav-link" id="logoutLink">LOGOUT</a>
					</li>
				</ul>
			</div>         
		</nav>
	<div class="container-fluid my-container">
			<div class="title"><br>EDIT PROFILE</div>
			<br><hr><br>
	</div>

	<form class="col-lg-8 off offset-lg-1 styles" id="editProfileForm">
	<div class="form-row required">
    <div class="form-group required col-md-6">
      <label class="control-label" for="firstName">FirstName</label>
      <input type="text" required class="form-control" id="firstName">
    </div>
    <div class="form-group required col-md-6">
      <label class="control-label" for="lastName">LastName</label>
      <input type="text" required class="form-control" id="lastName">
    </div>
    <div class="form-group required col-md-6">
      <label class="control-label" for="dateOfBirth">Date of Birth</label>
        <input type="date" required class="form-control" id="dateOfBirth">
    </div>
  </div>
  <div class="form-row">
    <div class="form-group  col-md-6">
      <label class="control-label" >Email</label>
      <input class="form-control" type="text" id="email" readonly>
    </div>
    <div class="form-group col-md-6">
      <label class="control-label" for="phone">Phone</label>
      <input type="tel" class="form-control" id="phone">
    </div>
  </div>
  <br />
  <div id="editError" class="alert alert-danger" style="display: none;"></div>
  <button type="submit" class="btn btn-primary">Update Details</button><br>
  <button type="button" class="btn btn-primary" id="changePasswordButton"> Change Password</button>
</form>

<div class="container-fluid my-container">

			<br><br><hr><br>
	</div>

    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN"
			crossorigin="anonymous"></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q"
			crossorigin="anonymous"></script>
		<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl"
			crossorigin="anonymous"></script>
		<script src="myScript.js"></script>
		<script src="js/auth.js"></script>
		<script>
			document.getElementById('logoutLink').addEventListener('click', (event) => {
				event.preventDefault();
				logout();
			});

			async function loadProfile() {
				const user = await getCurrentUser();
				if (!user) {
					window.location.href = `Customerlogin.html?returnUrl=${encodeURIComponent(window.location.href)}`;
					return;
				}

				const response = await fetch('/api/users/me');
				const profile = await response.json();

				document.getElementById('firstName').value = profile.firstName || '';
				document.getElementById('lastName').value = profile.lastName || '';
				document.getElementById('email').value = profile.email || '';
				document.getElementById('dateOfBirth').value = profile.dateOfBirth || '';
				document.getElementById('phone').value = profile.phone || '';
			}

			document.getElementById('editProfileForm').addEventListener('submit', async (event) => {
				event.preventDefault();

				const errorBox = document.getElementById('editError');
				errorBox.style.display = 'none';

				const response = await fetch('/api/users/me', {
					method: 'PUT',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({
						firstName: document.getElementById('firstName').value,
						lastName: document.getElementById('lastName').value,
						phone: document.getElementById('phone').value,
						dateOfBirth: document.getElementById('dateOfBirth').value
					})
				});

				if (!response.ok) {
					errorBox.textContent = 'Could not save your changes. Please try again.';
					errorBox.style.display = 'block';
					return;
				}

				window.location.href = 'Useraccount.html';
			});

			document.getElementById('changePasswordButton').addEventListener('click', () => {
				window.location.href = 'changepassword.html';
			});

			loadProfile();
		</script>
</body>
</html>
