<br>
    <div class="row g-5" style = "justify-content: center;">
      <div class="col-md-5 col-lg-4 order-md-last">
        <h4 class="d-flex justify-content-between align-items-center mb-3">
          <span class="text-primary" style = "margin: auto;">Order Summary</span>
        </h4>
        <ul class="list-group mb-3" id="orderSummaryList">
          <li class="list-group-item d-flex justify-content-between lh-sm">
            <div>
              <h6 class="my-0">Booking Reference</h6>
            </div>
            <span class="text-muted" id="summaryReference"></span>
          </li>
          <li class="list-group-item d-flex justify-content-between lh-sm">
            <div>
              <h6 class="my-0">Movie Name</h6>
              <small class="text-muted" id="summaryMovie"></small>
            </div>
          </li>
           <li class="list-group-item d-flex justify-content-between lh-sm">
            <div>
              <h6 class="my-0">Show Date</h6>
            </div>
            <span class="text-muted" id="summaryDate"></span>
          </li>
          <li class="list-group-item d-flex justify-content-between lh-sm">
            <div>
              <h6 class="my-0">Show Time</h6>
            </div>
            <span class="text-muted" id="summaryTime"></span>
          </li>
          <li class="list-group-item d-flex justify-content-between lh-sm">
            <div>
              <h6 class="my-0">Seats</h6>
            </div>
            <span class="text-muted" id="summarySeats"></span>
          </li>
          <li class="list-group-item" id="summaryItems"></li>
          <li class="list-group-item d-flex justify-content-between lh-sm">

            </div>

          </li>
          <li class="list-group-item d-flex justify-content-between">
            <span>Total (USD)</span>
            <strong id="summaryTotal"></strong>
          </li>
        </ul>

<br>
<div class="container"><button class="w-100 btn btn-primary btn-lg" type="submit"><a style = "text-decoration: none; color:white;" href = "../Cinema.html">RETURN TO HOMEPAGE</a></button><br><br></div>
<div class="container-fluid">
<br><hr class = "line"><br></div>

      <script src="myScript.js"></script>
      <script src="../js/format.js"></script>
      <script src="../js/auth.js"></script>
      <script>
        const params = new URLSearchParams(window.location.search);
        const bookingId = params.get('bookingId');

        async function init() {
          const user = await getCurrentUser();
          if (!user) {
            window.location.href = `../Customerlogin.html?returnUrl=${encodeURIComponent(window.location.href)}`;
            return;
          }
          document.getElementById('authNav').innerHTML = `
            <li class="nav-item">
              <a href="../Useraccount.html" class="nav-link"><i class="fas fa-user" style="margin-right: 10px"></i>ACCOUNT</a>
            </li>
            <li class="nav-item">
              <a href="#" class="nav-link" id="logoutLink">LOGOUT</a>
            </li>`;
          document.getElementById('logoutLink').addEventListener('click', (event) => {
            event.preventDefault();
            logout();
          });

          const response = await fetch(`/api/bookings/${bookingId}`);
          if (!response.ok) {
            document.getElementById('orderSummaryList').innerHTML = '<li class="list-group-item">Booking not found.</li>';
            return;
          }

          const booking = await response.json();

          if (booking.status !== 'CONFIRMED') {
            // Someone navigated here directly without actually paying yet.
            window.location.href = `checkout.html?bookingId=${bookingId}`;
            return;
          }

          document.getElementById('summaryReference').textContent = booking.bookingReference;
          document.getElementById('summaryMovie').textContent = booking.movieTitle;
          document.getElementById('summaryDate').textContent = formatDate(booking.showDate);
          document.getElementById('summaryTime').textContent = formatTime(booking.showTime);
          document.getElementById('summarySeats').textContent = booking.seatLabels.join(', ');
          document.getElementById('summaryItems').innerHTML = booking.items.map(item => `
            <div class="d-flex justify-content-between lh-sm">
              <span class="text-muted">${item.quantity} x ${item.ticketType}</span>
              <span class="text-muted">$${item.lineTotal.toFixed(2)}</span>
            </div>`).join('');
          document.getElementById('summaryPayment').textContent = `${booking.paymentMethod} ending in ${booking.maskedCardLast4}`;
          document.getElementById('summaryTotal').textContent = `$${booking.total.toFixed(2)}`;
        }

        init();
      </script>
  </body>
